window.onerror = function(msg, url, line, col, error) {
  console.error("BlockEditor Global Error:", msg, url, line, col, error);
  if (window.chrome && window.chrome.webview) {
    try {
      window.chrome.webview.postMessage(JSON.stringify({
        type: 'error',
        message: String(msg) + ' at ' + String(url) + ':' + String(line) + ':' + String(col)
      }));
    } catch(e) {}
  }
};
</script>

function _getWidgetDropdownOptions() {
  return _widgetRegistry.length > 0 ? _widgetRegistry : [['(no widgets in View Designer)', 'none']];

// ── Custom Field: FieldColour ────────────────────────────────
class FieldColour extends Blockly.Field {
  constructor(opt_value, opt_validator) {
    super(opt_value || '#2196F3', opt_validator);
    this.SERIALIZABLE = true;
    this.size_ = new Blockly.utils.Size(32, 18);
  }

  static fromJson(options) {
    const colour = options['colour'] || options['color'] || '#2196F3';
    return new FieldColour(colour);
  }

  initView() {
    super.initView();
    if (this.borderRect_) {
      this.borderRect_.setAttribute('rx', '4');
      this.borderRect_.setAttribute('ry', '4');
      this.borderRect_.setAttribute('width', '32');
      this.borderRect_.setAttribute('height', '18');
      this.borderRect_.setAttribute('stroke', '#ffffff');
      this.borderRect_.setAttribute('stroke-width', '1.5');
      this.borderRect_.style.cursor = 'pointer';
    }
    this.applyColour();
  }

  applyColour() {
    const val = this.getValue() || '#2196F3';
    if (this.borderRect_) {
      this.borderRect_.setAttribute('fill', val);
      this.borderRect_.style.fill = val;
    }
  }

  doValueUpdate_(newValue) {
    super.doValueUpdate_(newValue);
    this.applyColour();
  }

  getText_() {
    return '    ';
  }

  updateSize_() {
    if (this.size_) {
      this.size_.width = 32;
      this.size_.height = 18;
    }
  }

  showEditor_() {
    if (typeof document === 'undefined') return;
    const container = document.createElement('div');
    container.style.padding = '10px';
    container.style.width = '240px';
    container.style.background = '#1e293b';
    container.style.borderRadius = '8px';
    container.style.boxShadow = '0 8px 24px rgba(0,0,0,0.5)';
    container.style.color = '#e2e8f0';
    container.style.fontFamily = "'Segoe UI', 'Inter', sans-serif";
    container.style.fontSize = '12px';

    const title = document.createElement('div');
    title.innerText = 'Choose Color';
    title.style.fontWeight = '600';
    title.style.marginBottom = '8px';
    container.appendChild(title);

    const palette = [
      '#F44336', '#E91E63', '#9C27B0', '#673AB7',
      '#3F51B5', '#2196F3', '#03A9F4', '#00BCD4',
      '#009688', '#4CAF50', '#8BC34A', '#CDDC39',
      '#FFEB3B', '#FFC107', '#FF9800', '#FF5722',
      '#795548', '#9E9E9E', '#607D8B', '#000000',
      '#FFFFFF', '#1E293B', '#0D9488', '#E11D48'
    ];

    const grid = document.createElement('div');
    grid.style.display = 'grid';
    grid.style.gridTemplateColumns = 'repeat(6, 1fr)';
    grid.style.gap = '6px';
    grid.style.marginBottom = '10px';

    palette.forEach(c => {
      const swatch = document.createElement('div');
      swatch.style.width = '28px';
      swatch.style.height = '28px';
      swatch.style.borderRadius = '4px';
      swatch.style.backgroundColor = c;
      swatch.style.cursor = 'pointer';
      swatch.style.boxSizing = 'border-box';
      swatch.style.border = (c.toLowerCase() === (this.getValue() || '').toLowerCase())
        ? '2px solid #38bdf8'
        : '1px solid rgba(255,255,255,0.2)';
      swatch.title = c;
      swatch.onmouseenter = () => { swatch.style.transform = 'scale(1.15)'; };
      swatch.onmouseleave = () => { swatch.style.transform = 'scale(1)'; };
      swatch.onclick = () => {
        this.setValue(c);
        if (Blockly.DropDownDiv) Blockly.DropDownDiv.hideWithoutAnimation();
      };
      grid.appendChild(swatch);
    });
    container.appendChild(grid);

    const customRow = document.createElement('div');
    customRow.style.display = 'flex';
    customRow.style.alignItems = 'center';
    customRow.style.gap = '8px';

    const colorPicker = document.createElement('input');
    colorPicker.type = 'color';
    colorPicker.value = (this.getValue() && this.getValue().startsWith('#') && this.getValue().length >= 7)
      ? this.getValue().slice(0, 7)
      : '#2196f3';
    colorPicker.style.width = '34px';
    colorPicker.style.height = '28px';
    colorPicker.style.padding = '0';
    colorPicker.style.border = 'none';
    colorPicker.style.borderRadius = '4px';
    colorPicker.style.cursor = 'pointer';

    const hexInput = document.createElement('input');
    hexInput.type = 'text';
    hexInput.value = this.getValue() || '#2196F3';
    hexInput.style.flex = '1';
    hexInput.style.padding = '4px 8px';
    hexInput.style.background = '#0f172a';
    hexInput.style.border = '1px solid #475569';
    hexInput.style.borderRadius = '4px';
    hexInput.style.color = '#fff';
    hexInput.style.fontFamily = 'monospace';
    hexInput.style.fontSize = '12px';

    colorPicker.oninput = (e) => {
      hexInput.value = e.target.value.toUpperCase();
      this.setValue(e.target.value);
    };

    hexInput.onchange = (e) => {
      let val = e.target.value.trim();
      if (!val.startsWith('#')) val = '#' + val;
      if (/^#[0-9a-fA-F]{6}$/.test(val)) {
        colorPicker.value = val;
        this.setValue(val);
      }
    };

    const applyBtn = document.createElement('button');
    applyBtn.innerText = 'OK';
    applyBtn.style.padding = '4px 10px';
    applyBtn.style.background = '#2563eb';
    applyBtn.style.color = '#fff';
    applyBtn.style.border = 'none';
    applyBtn.style.borderRadius = '4px';
    applyBtn.style.cursor = 'pointer';
    applyBtn.style.fontWeight = '600';
    applyBtn.onclick = () => {
      let val = hexInput.value.trim();
      if (!val.startsWith('#')) val = '#' + val;
      this.setValue(val);
      if (Blockly.DropDownDiv) Blockly.DropDownDiv.hideWithoutAnimation();
    };

    customRow.appendChild(colorPicker);
    customRow.appendChild(hexInput);
    customRow.appendChild(applyBtn);
    container.appendChild(customRow);

    if (Blockly.DropDownDiv) {
      Blockly.DropDownDiv.createDom();
      Blockly.DropDownDiv.clearContent();
      const contentDiv = Blockly.DropDownDiv.getContentDiv();
      contentDiv.appendChild(container);
      Blockly.DropDownDiv.setColour('#1e293b', '#334155');
      Blockly.DropDownDiv.showPositionedByField(this, () => {});
    }
  }
}

Blockly.fieldRegistry.register('field_colour', FieldColour);

// Dynamic FieldDropdown support: ensure dynamic menuGenerator functions always return fresh options
const _origFieldDropdownGetOptions = Blockly.FieldDropdown.prototype.getOptions;
Blockly.FieldDropdown.prototype.getOptions = function(opt_useCache) {
  if (typeof this.menuGenerator_ === 'function') {
    this.generatedOptions = this.menuGenerator_();
    this.validateOptions(this.generatedOptions);
    return this.generatedOptions;
  }
  return _origFieldDropdownGetOptions.call(this, opt_useCache);
};

// Post-hoc: patch the menu generator on every WIDGET_ID dropdown
function patchWidgetDropdowns() {
  if (!workspace) return;
  const updateWorkspaceBlocks = (ws) => {
    if (!ws) return;
    const allBlocks = ws.getAllBlocks(false);
    allBlocks.forEach(block => {
      const field = block.getField('WIDGET_ID');
      if (field) {
        field.generatedOptions = null;
        field.menuGenerator_ = _getWidgetDropdownOptions;
        const currentVal = field.getValue();
        if (currentVal && currentVal !== 'none') {
          if (!_widgetRegistry.some(opt => opt[1] === currentVal)) {
            _widgetRegistry.unshift([currentVal, currentVal]);
          }
        }
      }
    });
  };
  updateWorkspaceBlocks(workspace);
  try {
    const flyout = workspace.getFlyout ? workspace.getFlyout() : (workspace.toolbox_ && workspace.toolbox_.flyout_);
    if (flyout && flyout.getWorkspace()) {
      updateWorkspaceBlocks(flyout.getWorkspace());
    }
  } catch(e) {}
}

window.updateWidgetIds = function(widgetListJson) {
  try {

        if (typeof widgets === 'string') {
          widgets = JSON.parse(widgets);
        }

    }
    if (Array.isArray(widgets) && widgets.length > 0) {

// ============================================================
// SnapCode — Dart Code Generator
// ============================================================
const dartGenerator = new Blockly.CodeGenerator('Dart');

dartGenerator.ORDER_ATOMIC = 0;
dartGenerator.ORDER_ADDITIVE = 4;
dartGenerator.ORDER_NONE = 99;
dartGenerator.INDENT = '  ';

dartGenerator.scrub_ = function(block, code, opt_thisOnly) {
  const nextBlock = block.nextConnection && block.nextConnection.targetBlock();
  if (nextBlock && !opt_thisOnly) {
    return code + this.blockToCode(nextBlock);
  }
  return code;
};

dartGenerator.workspaceToCode = function(ws) {
  if (!ws) return '';
  this.init(ws);
  const blocks = ws.getTopBlocks(true);
  const code = [];
  for (let i = 0; i < blocks.length; i++) {
    const block = blocks[i];
    // Ignore orphan value/reporter blocks (unconnected blocks that output a value)
    if (block.outputConnection && !block.previousConnection && !block.nextConnection) {
      continue;
    }
    let line = this.blockToCode(block);
    if (Array.isArray(line)) {
      // Top-level block returned a value tuple - do not emit bare expressions
      continue;
    }
    if (line) {
      code.push(line);
    }
  }
  return this.finish(code.join('\n'));
};

dartGenerator.init = function(ws) {
  dartGenerator._workspace = ws;
};

dartGenerator.finish = function(code) {
  const ws = dartGenerator._workspace || workspace;
  if (!ws) return code;

  const scaffoldBlock = ws.getAllBlocks(false).find(b => b.type === 'flutter_app_scaffold');
  if (!scaffoldBlock) {
    return code;
  }

  // Collect all raw imports
  const importBlocks = ws.getAllBlocks(false).filter(b => b.type === 'dart_raw_import');
  const customImports = importBlocks.map(b => b.getFieldValue('IMPORT').trim()).filter(Boolean);

  // Collect declared state variables
  const stateVarBlocks = ws.getAllBlocks(false).filter(b => b.type === 'state_declare_variable');
  const stateVars = stateVarBlocks.map(b => {
    const type = b.getFieldValue('TYPE') || 'String';
    const name = b.getFieldValue('NAME') || 'myStateVar';
    const init = b.getFieldValue('INIT_VAL') || "''";
    return `${type} ${name} = ${init};`;
  });

  // Collect initState statements
  const initBlocks = ws.getAllBlocks(false).filter(b => b.type === 'lifecycle_init_state');
  let initStatements = [];
  initBlocks.forEach(b => {
    const c = dartGenerator.statementToCode(b, 'DO');
    if (c.trim()) initStatements.push(c.trim());
  });

  // Collect dispose statements
  const disposeBlocks = ws.getAllBlocks(false).filter(b => b.type === 'lifecycle_dispose');
  let disposeStatements = [];
  disposeBlocks.forEach(b => {
    const c = dartGenerator.statementToCode(b, 'DO');
    if (c.trim()) disposeStatements.push(c.trim());
  });

  // Collect custom helper functions (logic_function)
  const funcBlocks = ws.getAllBlocks(false).filter(b => b.type === 'logic_function');
  let funcCodes = [];
  funcBlocks.forEach(b => {
    const fnName = b.getFieldValue('FUNC_NAME') || 'myFunction';
    const fBody = dartGenerator.statementToCode(b, 'BODY') || '  // function body';
    funcCodes.push(`void ${fnName}() {\n${indentCode(fBody)}\n}`);
  });

  // Collect all block types to auto-import Flutter packages
  const allBlockTypes = ws.getAllBlocks(false).map(b => b.type);
  let imports = new Set([
    "import 'package:flutter/material.dart';",
  ]);

  if (allBlockTypes.some(t => t.startsWith('pref_'))) {
    imports.add("import 'package:shared_preferences/shared_preferences.dart';");
  }
  if (allBlockTypes.some(t => t.startsWith('timer_'))) {
    imports.add("import 'dart:async';");
  }
  if (allBlockTypes.some(t => t.startsWith('http_'))) {
    imports.add("import 'package:http/http.dart' as http;");
    imports.add("import 'dart:convert';");
  }
  if (allBlockTypes.some(t => t.startsWith('ui_haptic_'))) {
    imports.add("import 'package:flutter/services.dart';");
  }
  if (allBlockTypes.some(t => t.startsWith('file_'))) {
    imports.add("import 'dart:io';");
    imports.add("import 'package:path_provider/path_provider.dart';");
  }
  if (allBlockTypes.some(t => t.startsWith('firebase_'))) {
    imports.add("import 'package:firebase_core/firebase_core.dart';");
    imports.add("import 'package:firebase_auth/firebase_auth.dart';");
    imports.add("import 'package:cloud_firestore/cloud_firestore.dart';");
  }

  // Add custom imports
  customImports.forEach(imp => {
    let trimmed = imp.trim();
    if (!trimmed.endsWith(';')) trimmed += ';';
    imports.add(trimmed);
  });

  const title = scaffoldBlock.getFieldValue('APP_TITLE') || 'My App';
  const colorHex = scaffoldBlock.getFieldValue('THEME_COLOR') || '#6C63FF';
  const dartColor = '0xFF' + colorHex.replace('#', '').toUpperCase();
  const body = dartGenerator.statementToCode(scaffoldBlock, 'BODY') || 'const Center(child: Text(\'Hello SnapCode!\'))';
  const bodyWidget = body.trim() || 'const Center(child: Text(\'Hello SnapCode!\'))';

  const importsStr = Array.from(imports).join('\n');
  const stateVarBlock = stateVars.length > 0 ? '\n  // State Variables\n  ' + stateVars.join('\n  ') + '\n' : '';

  let initStateMethod = '';
  if (initStatements.length > 0) {
    initStateMethod = `\n  @override\n  void initState() {\n    super.initState();\n${indentCode('    ' + initStatements.join('\n'))}\n  }\n`;
  }

  let disposeMethod = '';
  if (disposeStatements.length > 0) {
    disposeMethod = `\n  @override\n  void dispose() {\n${indentCode('    ' + disposeStatements.join('\n'))}\n    super.dispose();\n  }\n`;
  }

  const helperFunctionsBlock = funcCodes.length > 0 ? '\n  // Custom Functions\n' + funcCodes.map(f => indentCode(f)).join('\n\n') + '\n' : '';

  return `${importsStr}

void main() {
  WidgetsFlutterBinding.ensureInitialized();
  runApp(const MyApp());
}

class MyApp extends StatelessWidget {
  const MyApp({super.key});

  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      title: '${esc(title)}',
      debugShowCheckedModeBanner: false,
      theme: ThemeData(
        colorSchemeSeed: const Color(${dartColor}),
        useMaterial3: true,
        brightness: Brightness.light,
      ),
      home: const RootPage(),
    );
  }
}

class RootPage extends StatefulWidget {
  const RootPage({super.key});

  @override
  State<RootPage> createState() => _RootPageState();
}

class _RootPageState extends State<RootPage> {${stateVarBlock}${initStateMethod}${disposeMethod}${helperFunctionsBlock}
  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(
        title: const Text('${esc(title)}'),
        centerTitle: true,
      ),
      body: SafeArea(
        child: ${bodyWidget},
      ),
    );
  }
}
`;
};

// ── Utility functions ──────────────────────────────────
function esc(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'")
    .replace(/\$/g, '\\$')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r');
}

function hexToColor(hex) {
  if (!hex || hex === 'transparent' || hex === 'none') return '0x00000000';
  let clean = String(hex).replace('#', '').trim();
  if (clean.length === 6) return '0xFF' + clean.toUpperCase();
  if (clean.length === 8) return '0x' + clean.toUpperCase();
  if (clean.length === 3) return '0xFF' + clean.split('').map(c => c + c).join('').toUpperCase();
  return '0xFF000000';
}

function toPascalCase(str) {
  return (str || '').replace(/[^a-zA-Z0-9]/g, '_').split('_').filter(Boolean)
    .map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join('');
}

function toCamelCase(str) {
  const pascal = toPascalCase(str);
  return pascal ? pascal.charAt(0).toLowerCase() + pascal.slice(1) : '';
}

function indentCode(code) {
  return code.split('\n').filter(l => l.trim()).map(l => '  ' + l.trimStart()).join('\n');
}

function generateChildrenList(block, inputName) {
  let childBlock = block.getInputTargetBlock(inputName);
  let parts = [];
  while (childBlock) {
    const code = dartGenerator.blockToCode(childBlock);
    if (code) parts.push(code.trim().replace(/,\s*$/, ''));
    childBlock = childBlock.getNextBlock();
  }
  if (parts.length === 0) return 'const SizedBox.shrink(),';
  return parts.join(',\n    ') + ',';
}

// ============================================================
// Workspace Initialization
// ============================================================
let workspace = null;
let currentThemeMode = 'dark';

function initWorkspace(themeMode) {
  try {
    currentThemeMode = themeMode || 'dark';
    document.body.className = currentThemeMode;

    const theme = currentThemeMode === 'light' ? lightTheme : darkTheme;

    workspace = Blockly.inject('blocklyDiv', {
      toolbox: document.getElementById('toolbox'),
      theme: theme,
      renderer: 'thrasos',
      media: 'media/',
      grid: {
        spacing: 25,
        length: 3,
        colour: currentThemeMode === 'light' ? '#cbd5e1' : '#1e293b',
        snap: true,
      },
      zoom: {
        controls: true,
        wheel: true,
        startScale: 0.75,
        maxScale: 3,
        minScale: 0.3,
        scaleSpeed: 1.2,
        pinch: true,
      },
      trashcan: true,
      move: {
        scrollbars: { horizontal: true, vertical: true },
        drag: true,
        wheel: false,
      },
      sounds: false,
    });

    // Auto-generate code on workspace change
    workspace.addChangeListener(function(event) {
      if (event.isUiEvent) return;
      try {
        const code = dartGenerator.workspaceToCode(workspace);
        // Send generated code to C# host
        if (window.chrome && window.chrome.webview) {
          window.chrome.webview.postMessage(JSON.stringify({
            type: 'codeGenerated',
            data: code
          }));
        }
      } catch(e) {
        console.error('Code generation error:', e);
      }
    });

    // Notify host that workspace is ready
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.postMessage(JSON.stringify({ type: 'ready' }));
    }
  } catch(e) {
    console.error('initWorkspace error:', e);
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.postMessage(JSON.stringify({
        type: 'error',
        message: 'initWorkspace failed: ' + e.message
      }));
    }
  }
}

// C# ↔ JS Bridge Functions
// ============================================================

// Called from C# to load a saved workspace
window.loadWorkspace = function(jsonString) {
  try {
    if (!workspace) return;
    workspace.clear();
    if (jsonString && jsonString.trim() !== '' && jsonString.trim() !== '{}' && jsonString.trim() !== 'null' && jsonString.trim() !== '""') {
      let parsed = JSON.parse(jsonString);
      if (typeof parsed === 'string') {
        try { parsed = JSON.parse(parsed); } catch(e) {}
      }
      if (typeof parsed === 'object' && parsed !== null && Object.keys(parsed).length > 0) {
        Blockly.serialization.workspaces.load(parsed, workspace);
      }
    }
  } catch(e) {
    console.error('Failed to load workspace:', e);
  }
};

function getRootBlockType(widgetId, eventType, widgetType) {
  const evt = (eventType || '').toLowerCase();
  const wt = (widgetType || '').toLowerCase();

  if (widgetId === 'page' || evt === 'initstate' || evt === 'dispose' || evt === 'build') {
    if (evt === 'dispose') return 'lifecycle_dispose';
    return 'lifecycle_init_state';
  } else if (evt === 'onclick' || evt === 'ontap' || evt === 'click') {
    return 'widget_on_click';
  } else if (evt === 'onlongpress' || evt === 'longpress') {
    return 'widget_on_long_press';
  } else if (evt === 'ontextchanged' || evt === 'onsubmitted' || wt === 'textfield' || wt === 'edittext') {
    return 'widget_on_text_changed';
  } else if (evt === 'onsliderchanged' || wt === 'slider') {
    return 'widget_on_slider_changed';
  } else if (evt === 'oncheckboxchanged' || wt === 'checkbox') {
    return 'widget_on_checkbox_changed';
  } else if (evt === 'onswitchchanged' || wt === 'switch') {
    return 'widget_on_switch_changed';
  }
  return 'widget_on_click';
}

// Called from C# to initialize an isolated event workspace
window.loadEventWorkspace = function(widgetId, eventType, jsonString, widgetType) {
  try {
    if (!workspace) return;
    workspace.clear();

    const expectedBlockType = getRootBlockType(widgetId, eventType, widgetType);

    if (widgetId && widgetId !== 'page' && !_widgetRegistry.some(opt => opt[1] === widgetId)) {
      _widgetRegistry.unshift([widgetId + (widgetType ? ' (' + widgetType + ')' : ''), widgetId]);
    }

    let loaded = false;
    if (jsonString && jsonString.trim() !== '{}' && jsonString.trim() !== 'null' && jsonString.trim() !== '""' && jsonString.trim() !== '"\\"{}\\""') {
      let parsed = JSON.parse(jsonString);
      if (typeof parsed === 'string') {
          try { parsed = JSON.parse(parsed); } catch(e) {}
      }
      if (typeof parsed === 'object' && parsed !== null && Object.keys(parsed).length > 0) {
          Blockly.serialization.workspaces.load(parsed, workspace);
          loaded = true;
      }
    }

    if (!loaded) {
      createLockedRootBlock(widgetId, eventType, widgetType);
    } else {
      // If loaded from JSON, verify that the top root block matches the target widget and event
      const topBlocks = workspace.getTopBlocks(false);
      let rootBlock = topBlocks.find(b => b.type.startsWith('widget_on_') || b.type.startsWith('lifecycle_'));
      
      // If root block doesn't exist or is of wrong type, recreate it
      if (!rootBlock || rootBlock.type !== expectedBlockType) {
        workspace.clear();
        createLockedRootBlock(widgetId, eventType, widgetType);
        return;
      }

      if (widgetId && widgetId !== 'page') {
        const field = rootBlock.getField('WIDGET_ID');
        if (field) {
          field.menuGenerator_ = _getWidgetDropdownOptions;
          field.generatedOptions = null;
          field.setValue(widgetId);
          if (field.forceRerender) field.forceRerender();
        } else if (rootBlock.setFieldValue) {
          rootBlock.setFieldValue(widgetId, 'WIDGET_ID');
        }
      }
      rootBlock.setMovable(false);
      rootBlock.setDeletable(false);
      rootBlock.render();
    }
  } catch(e) {
    console.error('Failed to load event workspace:', e);
    createLockedRootBlock(widgetId, eventType, widgetType);
  }
};

function createLockedRootBlock(widgetId, eventType, widgetType) {
  let blockType = getRootBlockType(widgetId, eventType, widgetType);

  if (blockType) {
    if (widgetId && widgetId !== 'page' && !_widgetRegistry.some(opt => opt[1] === widgetId)) {
      _widgetRegistry.unshift([widgetId + (widgetType ? ' (' + widgetType + ')' : ''), widgetId]);
    }
    const rootBlock = workspace.newBlock(blockType);
    const field = rootBlock.getField('WIDGET_ID');
    if (field) {
      field.menuGenerator_ = _getWidgetDropdownOptions;
      field.generatedOptions = null;
      if (widgetId && widgetId !== 'page') {
        field.setValue(widgetId);
        if (field.forceRerender) field.forceRerender();
      }
    } else if (rootBlock.setFieldValue && widgetId && widgetId !== 'page') {
      rootBlock.setFieldValue(widgetId, 'WIDGET_ID');
    }

    rootBlock.initSvg();
    rootBlock.render();
    rootBlock.setMovable(false);
    rootBlock.setDeletable(false);
    rootBlock.moveBy(50, 50);
  }
}

// Called from C# to get current workspace state
window.getWorkspace = function() {
  try {
    if (!workspace) return '{}';
    return JSON.stringify(Blockly.serialization.workspaces.save(workspace));
  } catch(e) {
    console.error('Failed to save workspace:', e);
    return '{}';
  }
};

// Called from C# to get generated Dart code
window.getGeneratedCode = function() {
  try {
    if (!workspace) return '';
    return dartGenerator.workspaceToCode(workspace);
  } catch(e) {
    console.error('Failed to generate code:', e);
    return '';
  }
};

// Called from C# to compile headless workspace JSON to Dart code
window.generateCodeForWorkspaceJson = function(jsonStr) {
  try {
    if (!jsonStr || jsonStr === '{}' || jsonStr === 'null') return '';
    const state = typeof jsonStr === 'string' ? JSON.parse(jsonStr) : jsonStr;
    const headless = new Blockly.Workspace();
    Blockly.serialization.workspaces.load(state, headless);
    const code = dartGenerator.workspaceToCode(headless);
    headless.dispose();
    return code;
  } catch(e) {
    console.error('Failed to generate code for workspace JSON:', e);
    return '';
  }
};

// Called from C# to switch theme
window.setTheme = function(mode) {
  currentThemeMode = mode;
  document.body.className = mode;
  if (workspace) {
    const theme = mode === 'light' ? lightTheme : darkTheme;
    workspace.setTheme(theme);
    // Update grid color
    const gridPattern = workspace.getCanvas().querySelector('.blocklyGridPattern');
    if (gridPattern) {
      const lines = gridPattern.querySelectorAll('line');
      lines.forEach(l => l.setAttribute('stroke', mode === 'light' ? '#cbd5e1' : '#1e293b'));
    }
  }
};

// Called from C# to clear workspace
window.clearWorkspace = function() {
  if (workspace) workspace.clear();
};

// Called from C# to get block count
window.getBlockCount = function() {
  if (!workspace) return 0;
  return workspace.getAllBlocks(false).length;
};

let originalToolbox = null;

// Called from C# to set the active file context type (page, dialog, custom_view)
window.setWorkspaceContext = function(type) {
  const blocklyDiv = document.getElementById('blocklyDiv');
  let msgDiv = document.getElementById('noBlocksMsg');
  
  if (!msgDiv) {
    msgDiv = document.createElement('div');
    msgDiv.id = 'noBlocksMsg';
    msgDiv.style.position = 'absolute';
    msgDiv.style.top = '0';
    msgDiv.style.left = '0';
    msgDiv.style.width = '100%';
    msgDiv.style.height = '100%';
    msgDiv.style.display = 'flex';
    msgDiv.style.alignItems = 'center';
    msgDiv.style.justifyContent = 'center';
    msgDiv.style.fontSize = '1.5rem';
    msgDiv.style.fontWeight = 'bold';
    msgDiv.style.color = currentThemeMode === 'light' ? '#64748b' : '#94a3b8';
    msgDiv.style.backgroundColor = currentThemeMode === 'light' ? '#f0f4f8' : '#0c1020';
    msgDiv.style.zIndex = '1000';
    msgDiv.innerText = 'No blocks available for Custom Views';
    document.body.appendChild(msgDiv);
  }

  if (type === 'custom_view') {
    blocklyDiv.style.display = 'none';
    msgDiv.style.display = 'flex';
  } else {
    blocklyDiv.style.display = 'block';
    msgDiv.style.display = 'none';
    
    // Dynamically filter toolbox for 'dialog' vs 'page'
    if (workspace && originalToolbox) {
      let currentToolbox = originalToolbox.cloneNode(true);
      if (type === 'dialog' || type === 'dialogfragment') {
        let appStructureCategory = currentToolbox.querySelector('category[name="App Structure"]');
        if (appStructureCategory) {
          appStructureCategory.remove();
        }
      }
      workspace.updateToolbox(currentToolbox);
    }
  }
};

// Auto-initialize with dark theme on load
window.addEventListener('load', function() {
  try {
    originalToolbox = document.getElementById('toolbox').cloneNode(true);
    const params = new URLSearchParams(window.location.search);
    const theme = params.get('theme') || 'dark';
    initWorkspace(theme);
  } catch(e) {
    console.error('Window load error:', e);
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.postMessage(JSON.stringify({
        type: 'error',
        message: 'window load failed: ' + e.message
      }));
    }
  }
});
</script>
</body>
